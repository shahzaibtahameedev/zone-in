<ng-template #navLinks>
  <nav class="flex flex-col gap-1" aria-label="Main menu">
    @for (link of links(); track link.path) {
      <a
        class="nav-link"
        [routerLink]="link.path"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <svg [lucideIcon]="link.icon" class="size-[1.125rem] shrink-0"></svg>
        {{ link.label }}
      </a>
    }
  </nav>
</ng-template>

<ng-template #profileCard>
  <div class="rounded-xl bg-slate-50 p-3">
    <div class="flex items-center gap-3">
      <app-avatar [name]="profileName()" />
      <div class="min-w-0">
        <p class="truncate text-sm font-medium text-slate-900">{{ profileName() }}</p>
        <p class="text-xs text-slate-500">{{ profileRole() }}</p>
      </div>
    </div>
    <a
      [routerLink]="roleSelectPath"
      class="mt-2 flex min-h-11 items-center gap-2 rounded-lg px-2 text-sm font-medium text-violet-700 transition-colors hover:bg-violet-50"
      (click)="switchRole()"
    >
      <svg lucideArrowLeftRight class="size-4"></svg>
      Switch role
    </a>
  </div>
</ng-template>

<aside
  class="hidden lg:sticky lg:top-3 lg:m-3 lg:flex lg:h-[calc(100vh-1.5rem)] lg:w-60 lg:shrink-0 lg:flex-col lg:self-start lg:rounded-2xl lg:bg-white lg:p-3 lg:ring-1 lg:ring-slate-900/5"
>
  <div class="px-2 py-1.5">
    <app-logo />
  </div>
  <p class="mt-6 mb-2 px-3 text-[0.6875rem] font-medium tracking-wider text-slate-400">MENU</p>
  <ng-container [ngTemplateOutlet]="navLinks" />
  <div class="mt-auto">
    <ng-container [ngTemplateOutlet]="profileCard" />
  </div>
</aside>

<header class="sticky top-0 z-40 bg-page p-3 lg:hidden">
  <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-900/5">
    <div class="flex items-center justify-between">
      <app-logo />
      <button
        type="button"
        class="inline-flex size-11 items-center justify-center rounded-xl text-slate-700 transition-colors hover:bg-slate-50"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        @if (isMenuOpen()) {
          <svg lucideX class="size-5"></svg>
        } @else {
          <svg lucideMenu class="size-5"></svg>
        }
        <span class="sr-only">Menu</span>
      </button>
    </div>
    @if (isMenuOpen()) {
      <div id="mobile-menu" class="mt-3 flex flex-col gap-3 border-t border-slate-100 pt-3">
        <ng-container [ngTemplateOutlet]="navLinks" />
        <ng-container [ngTemplateOutlet]="profileCard" />
      </div>
    }
  </div>
</header>
